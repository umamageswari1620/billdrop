<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BillDrop</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
    input, textarea { display: block; width: 100%; margin: 6px 0; padding: 8px; box-sizing: border-box; }
    button { padding: 8px 14px; margin: 6px 6px 6px 0; }
    .error { color: #b00020; margin-top: 10px; }
    .ok { color: #0a6b2d; margin-top: 10px; }
    .warn { color: #b26a00; margin-top: 10px; }
    .row { display: flex; gap: 6px; }
    .row input { margin: 4px 0; }
    .box { border: 1px solid #ddd; padding: 12px; margin-top: 12px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>BillDrop</h1>
  <p>Supplier bills-ah clean records-aa maathunga, minutes-la.</p>

  <div id="login-box">
    <h2>Login</h2>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button id="login-btn">Login</button>
    <div id="message" class="error"></div>
  </div>

  <div id="info-box" style="display:none;">
    <h2>Welcome</h2>
    <p>Email: <span id="user-email"></span></p>
    <p>Role: <span id="user-role"></span></p>

    <div class="box">
      <h2>1. Bill upload</h2>
      <input id="bill-file" type="file" accept="image/*">
      <button id="read-btn">Read Bill</button>
      <p id="read-status"></p>
      <details>
        <summary>OCR text (check ku)</summary>
        <pre id="ocr-text" style="white-space: pre-wrap;"></pre>
      </details>
    </div>

    <div class="box" id="review-box" style="display:none;">
      <h2>2. Review</h2>
      <label>Supplier</label>
      <input id="f-supplier">
      <label>Bill number</label>
      <input id="f-bill-number">
      <label>Bill date (YYYY-MM-DD)</label>
      <input id="f-bill-date" placeholder="2026-10-12">
      <label>Lines</label>
      <div id="lines"></div>
      <button id="add-line-btn">+ Line add</button>
      <label>Total</label>
      <input id="f-total" type="number" step="0.01">
      <div id="check-msg"></div>
      <button id="save-btn">Save to database</button>
      <p id="save-status"></p>
    </div>

    <button id="logout-btn">Logout</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://aqgatfdlthhctqlqkkhp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7AtV3H0JpUPdzbLttAb2Ew_gGqeCKQF';

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const $ = (id) => document.getElementById(id);

    let session = null;
    let currentPerson = null;
    let currentFile = null;

    async function login() {
      $('message').textContent = '';
      const email = $('email').value.trim();
      const password = $('password').value;

      const { data, error } = await db.auth.signInWithPassword({ email, password });
      if (error) { $('message').textContent = 'Login fail: ' + error.message; return; }

      const { data: person, error: personError } = await db
        .from('people')
        .select('id, name, email, role')
        .eq('login_id', data.user.id)
        .maybeSingle();

      if (personError) { $('message').textContent = 'People read error: ' + personError.message; await db.auth.signOut(); return; }
      if (!person) { $('message').textContent = 'Intha account BillDrop people list-la illai.'; await db.auth.signOut(); return; }

      session = data.session;
      currentPerson = person;
      $('user-email').textContent = person.email;
      $('user-role').textContent = person.role;

      if (person.role === 'manager') {
        $('read-btn').disabled = true;
        $('save-btn').disabled = true;
        $('read-status').textContent = 'Manager-ku bill upload/save permission illai.';
      }

      $('login-box').style.display = 'none';
      $('info-box').style.display = 'block';
    }

    async function logout() {
      await db.auth.signOut();
      session = null;
      currentPerson = null;
      $('password').value = '';
      $('review-box').style.display = 'none';
      $('info-box').style.display = 'none';
      $('login-box').style.display = 'block';
    }

    async function readBill() {
      currentFile = $('bill-file').files[0];
      const status = $('read-status');
      if (!currentFile) { status.className = 'error'; status.textContent = 'Modhalla bill file select pannunga.'; return; }

      status.className = '';
      status.textContent = 'OCR nadakkudhu... 20-30 seconds aagum.';
      let text = '';
      try {
        const result = await Tesseract.recognize(currentFile, 'eng');
        text = result.data.text || '';
        $('ocr-text').textContent = text;
      } catch (e) {
        status.className = 'warn';
        status.textContent = 'OCR fail. Fields-ah kaiyaala type pannunga.';
        showReview(null);
        return;
      }

      status.textContent = 'AI-la fields edukkudhu...';
      let parsed = null;
      try {
        const res = await fetch(SUPABASE_URL + '/functions/v1/parse-bill', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + session.access_token
          },
          body: JSON.stringify({ text })
        });
        const json = await res.json();
        parsed = json.ok ? json.parsed : null;
      } catch (e) {
        parsed = null;
      }

      if (parsed) {
        status.className = 'ok';
        status.textContent = 'AI fields edukkiradhu. Check panni Save pannunga.';
      } else {
        status.className = 'warn';
        status.textContent = 'AI fields edukka mudiyala. Kaiyaala type pannunga.';
      }
      showReview(parsed);
    }

    function showReview(p) {
      $('review-box').style.display = 'block';
      $('f-supplier').value = p?.supplier || '';
      $('f-bill-number').value = p?.bill_number || '';
      $('f-bill-date').value = p?.bill_date || '';
      $('f-total').value = p?.total ?? '';
      $('lines').innerHTML = '';
      const lines = Array.isArray(p?.lines) ? p.lines : [];
      if (lines.length === 0) addLine('', '');
      lines.forEach(l => addLine(l.description || '', l.amount ?? ''));
      $('save-status').textContent = '';
      runChecks();
    }

    function addLine(desc, amount) {
      const div = document.createElement('div');
      div.className = 'row';
      div.innerHTML =
        '<input class="l-desc" placeholder="Description" value="">' +
        '<input class="l-amt" type="number" step="0.01" placeholder="Amount" style="max-width:120px">' +
        '<button type="button" class="l-del">X</button>';
      div.querySelector('.l-desc').value = desc;
      div.querySelector('.l-amt').value = amount;
      div.querySelector('.l-del').onclick = () => { div.remove(); runChecks(); };
      div.querySelectorAll('input').forEach(i => i.addEventListener('input', runChecks));
      $('lines').appendChild(div);
    }

    function getLines() {
      return [...document.querySelectorAll('#lines .row')]
        .map(r => ({
          description: r.querySelector('.l-desc').value.trim(),
          amount: Number(r.querySelector('.l-amt').value) || 0
        }))
        .filter(l => l.description || l.amount);
    }

    function runChecks() {
      const lines = getLines();
      const linesTotal = lines.reduce((s, l) => s + l.amount, 0);
      const total = Number($('f-total').value) || 0;
      const diff = Math.round((total - linesTotal) * 100) / 100;
      const msg = $('check-msg');
      if (Math.abs(diff) > 1) {
        msg.className = 'error';
        msg.textContent = 'Total is off by ₹' + Math.abs(diff) + '. (Lines total: ₹' + linesTotal + ')';
      } else {
        msg.className = 'ok';
        msg.textContent = 'Lines total: ₹' + linesTotal + ' (total-oda match aagudhu)';
      }
    }

    async function saveBill() {
      const status = $('save-status');
      if (currentPerson.role !== 'accountant') { status.className = 'error'; status.textContent = 'Accountant mattum save panna mudiyum.'; return; }

      const supplierName = $('f-supplier').value.trim();
      const billNumber = $('f-bill-number').value.trim();
      const billDate = $('f-bill-date').value.trim() || null;
      const total = Number($('f-total').value) || 0;
      const lines = getLines();
      const linesTotal = Math.round(lines.reduce((s, l) => s + l.amount, 0) * 100) / 100;
      const diff = Math.round((total - linesTotal) * 100) / 100;
      const problem = Math.abs(diff) > 1 ? 'Total is off by ₹' + Math.abs(diff) : null;

      if (!supplierName) { status.className = 'error'; status.textContent = 'Supplier name venum.'; return; }

      status.className = 'ok';
      status.textContent = 'Saving...';

      let supplierId = null;
      const { data: existing } = await db.from('suppliers').select('id').eq('name', supplierName).maybeSingle();
      if (existing) {
        supplierId = existing.id;
      } else {
        const { data: created, error: supErr } = await db.from('suppliers').insert({ name: supplierName }).select().single();
        if (supErr) { status.className = 'error'; status.textContent = 'Supplier save fail: ' + supErr.message; return; }
        supplierId = created.id;
      }

      const { data: batch, error: batchError } = await db
        .from('batches').insert({ uploaded_by: currentPerson.id }).select().single();
      if (batchError) { status.className = 'error'; status.textContent = 'Batch save fail: ' + batchError.message; return; }

      const { data: bill, error: billError } = await db
        .from('bills')
        .insert({
          batch_id: batch.id,
          supplier_id: supplierId,
          bill_number: billNumber || null,
          bill_date: billDate,
          total: total,
          lines_total: linesTotal,
          file_path: currentFile ? 'uploads/' + currentFile.name : null,
          ocr_text: $('ocr-text').textContent || null,
          status: problem ? 'problem' : 'saved',
          problem: problem,
          saved_at: new Date().toISOString()
        })
        .select().single();
      if (billError) { status.className = 'error'; status.textContent = 'Bill save fail: ' + billError.message; return; }

      if (lines.length > 0) {
        const rows = lines.map(l => ({ bill_id: bill.id, description: l.description, amount: l.amount }));
        const { error: lineError } = await db.from('bill_lines').insert(rows);
        if (lineError) { status.className = 'error'; status.textContent = 'Lines save fail: ' + lineError.message; return; }
      }

      status.className = 'ok';
      status.textContent = 'Saved! Bill id: ' + bill.id + (problem ? ' (problem: ' + problem + ')' : '');
    }

    $('login-btn').addEventListener('click', login);
    $('logout-btn').addEventListener('click', logout);
    $('read-btn').addEventListener('click', readBill);
    $('save-btn').addEventListener('click', saveBill);
    $('add-line-btn').addEventListener('click', () => { addLine('', ''); runChecks(); });
    $('f-total').addEventListener('input', runChecks);
  </script>
</body>
</html>
