<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BillDrop - Supplier Bill Processing</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 680px; margin: 40px auto; padding: 0 16px; }
    input { display: block; width: 100%; margin: 4px 0 8px; padding: 6px; box-sizing: border-box; }
    button { padding: 8px 14px; margin: 6px 6px 6px 0; }
    .error { color: #b00020; }
    .ok { color: #0a6b2d; }
    .warn { color: #b26a00; }
    .notice { background: #fff8e1; border: 1px solid #f0c040; padding: 8px; border-radius: 6px; font-size: 14px; }
    .box { border: 1px solid #ddd; padding: 12px; margin-top: 12px; border-radius: 6px; }
    .card { border: 2px solid #ccc; padding: 10px; margin: 10px 0; border-radius: 6px; }
    .card.problem { border-color: #b00020; }
    .card.saved { border-color: #0a6b2d; }
    .card.failed { border-color: #666; background: #f3f3f3; }
    small { color: #555; }
  </style>
</head>
<body>
  <h1>BillDrop</h1>
  <p>Turn Supplier bills into clean, checked records in minutes.</p>
  <p class="notice">Practice project. Please use made-up bills only. Do not upload real bills, names, phone numbers or addresses.</p>

  <div id="login-box">
    <h2>Login</h2>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button id="login-btn">Login</button>
    <div id="message" class="error"></div>
  </div>

  <div id="info-box" style="display:none;">
    <h2>Welcome</h2>
    <p>Email: <span id="user-email"></span></p>
    <p>Role: <span id="user-role"></span></p>

    <div class="box">
      <h2>Batch upload</h2>
      <input id="batch-files" type="file" accept="image/*" multiple>
      <button id="process-btn">Process batch</button>
      <button id="save-all-btn">Save All Clean Bills</button>
      <button id="excel-btn">Download Excel</button>
      <p id="batch-msg"></p>
      <div id="cards"></div>
    </div>

    <div class="box">
      <h2>Supplier totals (this month)</h2>
      <button id="totals-btn">Load totals</button>
      <ul id="totals"></ul>
    </div>

    <button id="logout-btn">Logout</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://aqgatfdlthhctqlqkkhp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7AtV3H0JpUPdzbLttAb2Ew_gGqeCKQF';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const $ = id => document.getElementById(id);

    let session = null, person = null, batchId = null;
    let cards = [], dbKeys = new Set();

    const norm = s => (s || '').toLowerCase().replace(/\s+/g, '');
    const keyOf = c => norm(c.supplier) + '|' + norm(c.bill_number);
    const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
    const round2 = n => Math.round(n * 100) / 100;
    const linesTotal = c => round2(c.lines.reduce((s, l) => s + (Number(l.amount) || 0), 0));
    const msg = (t, cls = 'error') => { $('batch-msg').className = cls; $('batch-msg').textContent = t; };

    async function login() {
      $('message').textContent = '';
      const { data, error } = await db.auth.signInWithPassword({
        email: $('email').value.trim(), password: $('password').value
      });
      if (error) { $('message').textContent = 'Login failed: ' + error.message; return; }

      const { data: p, error: pe } = await db.from('people')
        .select('id, name, email, role').eq('login_id', data.user.id).maybeSingle();
      if (pe) { $('message').textContent = 'Could not read people table: ' + pe.message; await db.auth.signOut(); return; }
      if (!p) { $('message').textContent = 'This account is not in the BillDrop people list.'; await db.auth.signOut(); return; }

      session = data.session; person = p;
      $('user-email').textContent = p.email;
      $('user-role').textContent = p.role;
      if (p.role !== 'accountant') {
        $('process-btn').disabled = true;
        $('save-all-btn').disabled = true;
        $('batch-files').disabled = true;
        msg('Managers do not have upload or save permission.', 'warn');
      }
      $('login-box').style.display = 'none';
      $('info-box').style.display = 'block';
    }

    async function logout() {
      await db.auth.signOut();
      session = null; person = null; batchId = null; cards = [];
      $('password').value = '';
      $('cards').innerHTML = '';
      $('batch-msg').textContent = '';
      $('info-box').style.display = 'none';
      $('login-box').style.display = 'block';
    }

    async function loadDbKeys() {
      const [{ data: sups }, { data: bills }] = await Promise.all([
        db.from('suppliers').select('id, name'),
        db.from('bills').select('bill_number, supplier_id').not('bill_number', 'is', null)
      ]);
      const names = Object.fromEntries((sups || []).map(s => [s.id, s.name]));
      dbKeys = new Set((bills || []).map(b => norm(names[b.supplier_id]) + '|' + norm(b.bill_number)));
    }

    function computeProblem(c) {
      const probs = [];
      if (c.aiNote) probs.push(c.aiNote);
      if (!c.supplier.trim()) probs.push('Supplier name is missing');
      const diff = round2((Number(c.total) || 0) - linesTotal(c));
      if (Math.abs(diff) > 1) probs.push('Total is off by ₹' + Math.abs(diff));
      if (c.bill_number && c.supplier) {
        const k = keyOf(c);
        if (dbKeys.has(k)) probs.push('Already entered (already in database)');
        const i = cards.indexOf(c);
        const earlier = cards.slice(0, i).some(o => !o.saved_bill_id && o.status !== 'failed' && o.bill_number && keyOf(o) === k);
        if (earlier) probs.push('Duplicate within this batch');
      }
      return probs.join(' | ');
    }

    async function processCard(c) {
      for (let attempt = 1; attempt <= 3; attempt++) {
        try {
          c.status = 'reading'; renderCards();
          const r = await Tesseract.recognize(c.file, 'eng');
          c.ocr_text = r.data.text || '';

          const res = await fetch(SUPABASE_URL + '/functions/v1/parse-bill', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': SUPABASE_KEY,
              'Authorization': 'Bearer ' + session.access_token
            },
            body: JSON.stringify({ text: c.ocr_text })
          });
          const json = await res.json();

          if (!json.ok) {
            c.aiNote = 'AI could not read the fields. Please type them manually.';
            c.supplier = ''; c.bill_number = ''; c.bill_date = ''; c.total = 0; c.lines = [];
          } else {
            const p = json.parsed;
            c.aiNote = '';
            c.supplier = p.supplier || '';
            c.bill_number = p.bill_number || '';
            c.bill_date = p.bill_date || '';
            c.total = Number(p.total) || 0;
            c.lines = Array.isArray(p.lines) ? p.lines : [];
          }
          c.status = 'ready';
          return;
        } catch (e) {
          if (attempt === 3) {
            c.status = 'failed';
            c.aiNote = 'Read failed: ' + e.message;
            return;
          }
          await new Promise(r => setTimeout(r, 1500));
        }
      }
    }

    async function processBatch() {
      const files = [...$('batch-files').files];
      if (!files.length) return msg('Please select bill files.');
      if (files.length > 20) return msg('Maximum 20 files per batch.');

      $('process-btn').disabled = true;
      batchId = null; cards = [];
      await loadDbKeys();
      files.forEach((f, i) => cards.push({
        i, file: f, status: 'waiting', supplier: '', bill_number: '', bill_date: '',
        total: 0, lines: [], ocr_text: '', aiNote: '', saved_bill_id: null, problem: ''
      }));
      renderCards();

      for (let n = 0; n < cards.length; n++) {
        msg('Processing ' + (n + 1) + ' of ' + cards.length + ' ...', 'warn');
        await processCard(cards[n]);
        renderCards();
      }
      renderCards();
      msg('Batch finished. Review the red cards and click Save.', 'ok');
      $('process-btn').disabled = false;
    }

    async function insertBill(c) {
      if (!batchId) {
        const { data, error } = await db.from('batches').insert({ uploaded_by: person.id }).select().single();
        if (error) { msg('Batch save failed: ' + error.message); return false; }
        batchId = data.id;
      }

      let supplierId;
      const { data: ex } = await db.from('suppliers').select('id').eq('name', c.supplier.trim()).maybeSingle();
      if (ex) supplierId = ex.id;
      else {
        const { data: cr, error } = await db.from('suppliers').insert({ name: c.supplier.trim() }).select().single();
        if (error) { msg('Supplier save failed: ' + error.message); return false; }
        supplierId = cr.id;
      }

      const { data: bill, error: be } = await db.from('bills').insert({
        batch_id: batchId, supplier_id: supplierId,
        bill_number: c.bill_number || null, bill_date: c.bill_date || null,
        total: Number(c.total) || 0, lines_total: linesTotal(c),
        file_path: 'uploads/' + c.file.name, ocr_text: c.ocr_text,
        status: 'saved', problem: null, saved_at: new Date().toISOString()
      }).select().single();
      if (be) { msg('Bill save failed: ' + be.message); return false; }

      if (c.lines.length) {
        const rows = c.lines.map(l => ({
          bill_id: bill.id, description: l.description || '', amount: Number(l.amount) || 0
        }));
        const { error: le } = await db.from('bill_lines').insert(rows);
        if (le) { msg('Line items save failed: ' + le.message); return false; }
      }

      c.saved_bill_id = bill.id;
      c.status = 'saved';
      dbKeys.add(keyOf(c));
      return true;
    }

    async function saveOne(c) {
      if (person.role !== 'accountant') return msg('Only accountants can save bills.');
      const p = computeProblem(c);
      if (p) { renderCards(); return msg('Please fix: ' + p); }
      if (await insertBill(c)) { renderCards(); msg('Saved! Bill id: ' + c.saved_bill_id, 'ok'); }
    }

    async function saveAllClean() {
      if (person.role !== 'accountant') return msg('Only accountants can save bills.');
      let saved = 0;
      for (const c of cards) {
        if (c.saved_bill_id || c.status !== 'ready') continue;
        if (computeProblem(c)) continue;
        if (await insertBill(c)) saved++;
        renderCards();
      }
      msg(saved + ' clean bills saved. Review the red cards and save them manually.', 'ok');
    }
    
    function renderCards() {
      cards.forEach(c => {
        if (c.saved_bill_id || c.status === 'failed' || c.status === 'reading' || c.status === 'waiting') return;
        c.problem = computeProblem(c);
        c.status = c.problem ? 'problem' : 'ready';
      });

      const box = $('cards');
      box.innerHTML = '';
      cards.forEach(c => {
        const cls = c.saved_bill_id ? 'saved' : c.status === 'failed' ? 'failed' : c.status === 'problem' ? 'problem' : '';
        const div = document.createElement('div');
        div.className = 'card ' + cls;
        const label = c.saved_bill_id ? 'saved (id ' + c.saved_bill_id + ')' : c.status;
        div.innerHTML = '<b>' + esc(c.file.name) + '</b> — <small>' + esc(label) + '</small>' +
          (c.problem && !c.saved_bill_id ? '<div class="error">' + esc(c.problem) + '</div>' : '') +
          (c.status === 'failed' ? '<div class="error">' + esc(c.aiNote) + '</div>' : '');

        if (!['waiting', 'reading', 'failed'].includes(c.status) || c.saved_bill_id) {
          const fields = [
            ['supplier', 'Supplier', 'text'],
            ['bill_number', 'Bill number', 'text'],
            ['bill_date', 'Date (YYYY-MM-DD)', 'text'],
            ['total', 'Total', 'number']
          ];
          fields.forEach(([key, label, type]) => {
            const lab = document.createElement('label');
            lab.textContent = label;
            const inp = document.createElement('input');
            inp.type = type;
            inp.value = c[key] ?? '';
            inp.disabled = !!c.saved_bill_id || person.role !== 'accountant';
            inp.addEventListener('change', () => {
              c[key] = type === 'number' ? Number(inp.value) || 0 : inp.value;
              renderCards();
            });
            div.appendChild(lab);
            div.appendChild(inp);
          });

          const lt = document.createElement('small');
          lt.textContent = 'Lines total: ₹' + linesTotal(c) + ' (' +
            c.lines.map(l => (l.description || '') + ' ' + (l.amount || 0)).join(', ') + ')';
          div.appendChild(lt);

          if (!c.saved_bill_id && person.role === 'accountant') {
            const b = document.createElement('button');
            b.textContent = 'Save';
            b.onclick = () => saveOne(c);
            div.appendChild(document.createElement('br'));
            div.appendChild(b);
          }
        }
        box.appendChild(div);
      });
    }
    
    function exportExcel() {
      if (!cards.length) return msg('Please process a batch first.');
      cards.forEach(c => { if (!c.saved_bill_id) c.problem = computeProblem(c); });
      const rows = cards.map(c => ({
        Supplier: c.supplier,
        'Bill number': c.bill_number,
        Date: c.bill_date,
        Total: c.total,
        Status: c.saved_bill_id ? 'saved' : c.status,
        Problem: c.saved_bill_id ? '' : (c.problem || '')
      }));
      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Batch');
      XLSX.writeFile(wb, 'billdrop-batch.xlsx');
    }

    async function loadTotals() {
      const [{ data: sups }, { data: bills }] = await Promise.all([
        db.from('suppliers').select('id, name'),
        db.from('bills').select('supplier_id, total, saved_at').eq('status', 'saved')
      ]);
      const names = Object.fromEntries((sups || []).map(s => [s.id, s.name]));
      const now = new Date();
      const sums = {};
      (bills || []).forEach(b => {
        const d = new Date(b.saved_at);
        if (d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) {
          sums[b.supplier_id] = round2((sums[b.supplier_id] || 0) + Number(b.total));
        }
      });
      $('totals').innerHTML = Object.entries(sums)
        .map(([id, t]) => '<li>' + esc(names[id]) + ': ₹' + t + '</li>').join('')
        || '<li>No saved bills this month</li>';
    }

    $('login-btn').addEventListener('click', login);
    $('logout-btn').addEventListener('click', logout);
    $('process-btn').addEventListener('click', processBatch);
    $('save-all-btn').addEventListener('click', saveAllClean);
    $('excel-btn').addEventListener('click', exportExcel);
    $('totals-btn').addEventListener('click', loadTotals);
  </script>
</body>
</html>
