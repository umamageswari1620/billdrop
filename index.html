<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BillDrop</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    input { display: block; width: 100%; margin: 8px 0; padding: 8px; box-sizing: border-box; }
    button { padding: 8px 16px; margin-top: 8px; }
    .error { color: #b00020; margin-top: 12px; }
    .ok { color: #0a6b2d; margin-top: 12px; }
    pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>BillDrop</h1>
  <p>Supplier bills-ah clean records-aa maathunga, minutes-la.</p>

  <div id="login-box">
    <h2>Login</h2>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button id="login-btn">Login</button>
    <div id="message" class="error"></div>
  </div>

  <div id="info-box" style="display:none;">
    <h2>Welcome</h2>
    <p>Email: <span id="user-email"></span></p>
    <p>Role: <span id="user-role"></span></p>

    <h2>Bill upload (OCR test)</h2>
    <input id="bill-file" type="file" accept="image/*">
    <button id="ocr-btn">Read Bill</button>
    <p id="ocr-status"></p>
    <pre id="ocr-text"></pre>
    <button id="save-btn">Save to database</button>
    <p id="save-status"></p>

    <button id="logout-btn">Logout</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://aqgatfdlthhctqlqkkhp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_7AtV3H0JpUPdzbLttAb2Ew_gGqeCKQF';

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const loginBox = document.getElementById('login-box');
    const infoBox = document.getElementById('info-box');
    const message = document.getElementById('message');
    let currentPersonId = null;

    async function login() {
      message.textContent = '';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { data, error } = await db.auth.signInWithPassword({ email, password });
      if (error) { message.textContent = 'Login fail: ' + error.message; return; }

      const { data: person, error: personError } = await db
        .from('people')
        .select('id, name, email, role')
        .eq('login_id', data.user.id)
        .maybeSingle();

      if (personError) {
        message.textContent = 'People read error: ' + personError.message;
        await db.auth.signOut();
        return;
      }
      if (!person) {
        message.textContent = 'Intha account BillDrop people list-la illai.';
        await db.auth.signOut();
        return;
      }

      currentPersonId = person.id;
      document.getElementById('user-email').textContent = person.email;
      document.getElementById('user-role').textContent = person.role;
      loginBox.style.display = 'none';
      infoBox.style.display = 'block';
    }

    async function logout() {
      await db.auth.signOut();
      currentPersonId = null;
      document.getElementById('password').value = '';
      document.getElementById('ocr-text').textContent = '';
      document.getElementById('ocr-status').textContent = '';
      document.getElementById('save-status').textContent = '';
      infoBox.style.display = 'none';
      loginBox.style.display = 'block';
    }

    async function readBill() {
      const file = document.getElementById('bill-file').files[0];
      const status = document.getElementById('ocr-status');
      const output = document.getElementById('ocr-text');

      if (!file) { status.textContent = 'Modhalla bill file select pannunga.'; return; }

      status.textContent = 'Reading... 20-30 seconds aagum, wait pannunga.';
      output.textContent = '';

      try {
        const result = await Tesseract.recognize(file, 'eng');
        status.textContent = 'Reading mudinjiduchu.';
        output.textContent = result.data.text;
      } catch (e) {
        status.textContent = 'OCR fail aayiduchu: ' + e.message;
      }
    }

    async function saveBill() {
      const text = document.getElementById('ocr-text').textContent;
      const status = document.getElementById('save-status');

      if (!text.trim()) { status.className = 'error'; status.textContent = 'Modhalla bill-ah read pannunga.'; return; }
      if (!currentPersonId) { status.className = 'error'; status.textContent = 'Login pannunga.'; return; }

      status.className = 'ok';
      status.textContent = 'Saving...';

      const { data: batch, error: batchError } = await db
        .from('batches')
        .insert({ uploaded_by: currentPersonId })
        .select()
        .single();

      if (batchError) {
        status.className = 'error';
        status.textContent = 'Batch save fail: ' + batchError.message;
        return;
      }

      const { data: bill, error: billError } = await db
        .from('bills')
        .insert({
          batch_id: batch.id,
          file_path: 'test-upload',
          ocr_text: text,
          status: 'ready'
        })
        .select()
        .single();

      if (billError) {
        status.className = 'error';
        status.textContent = 'Bill save fail: ' + billError.message;
        return;
      }

      status.className = 'ok';
      status.textContent = 'Saved! Bill id: ' + bill.id;
    }

    document.getElementById('login-btn').addEventListener('click', login);
    document.getElementById('logout-btn').addEventListener('click', logout);
    document.getElementById('ocr-btn').addEventListener('click', readBill);
    document.getElementById('save-btn').addEventListener('click', saveBill);
  </script>
</body>
</html>
